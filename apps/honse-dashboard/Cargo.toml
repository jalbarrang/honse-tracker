[package]
name = "honse-dashboard"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false
description = "Honse Tracker desktop sidecar: authenticated localhost turn ingest, durable SQLite storage, and the training dashboard UI"

[[bin]]
name = "honse-dashboard"
path = "src/main.rs"

[lib]
name = "honse_dashboard"
path = "src/lib.rs"

[lints]
workspace = true

[dependencies]
honse-telemetry = { path = "../../crates/honse-telemetry" }
prost = "0.13"

dioxus = { version = "0.7.9", features = ["desktop"] }

tokio = { version = "1.53", features = ["rt-multi-thread", "net", "macros", "sync", "time"] }
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "tokio"] }

rusqlite = { version = "0.40.1", features = ["bundled"] }

anyhow = "1"
blake3 = { workspace = true }
getrandom = "0.3"
secrecy = "0.10.3"
serde = { workspace = true }
serde_json = { workspace = true }

tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Console",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
http-body-util = "0.1"
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
