[package]
name = "career-viewer"
version = "0.4.1"
edition.workspace = true
license.workspace = true
publish = false
description = "Browse the Independent Training careers the plugin exports"

[[bin]]
name = "career-viewer"
path = "src/main.rs"

[dependencies]
honse-career-meta = { path = "../honse-career-meta" }
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal"] }
maud = "0.27"
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
ureq = { workspace = true }

[lints]
workspace = true
