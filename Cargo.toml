[workspace]
resolver = "2"
members = [
    "crates/career-viewer",
    "crates/edge-sdk",
    "crates/honse-career-meta",
    "crates/honse-services",
    "crates/honse-telemetry",
]

# The plugin is what a bare `cargo build --release` should produce — that is what
# `scripts/deploy-windows.ps1` runs, and a deploy has no reason to compile the
# career viewer's web stack. CI still passes `--workspace`, so nothing escapes it.
default-members = ["."]

[package]
name = "honse-tracker"
version = "0.4.1"
edition.workspace = true
license.workspace = true
publish = false
description = "Training Tracker edge plugin (ported from hachimi-redux in-core module)"

[lib]
name = "honse_tracker"
crate-type = ["cdylib", "rlib"]

[dependencies]
edge-sdk = { path = "crates/edge-sdk" }
honse-career-meta = { path = "crates/honse-career-meta" }
honse-services = { path = "crates/honse-services" }
hachimi_telemetry = { package = "honse-telemetry", path = "crates/honse-telemetry" }
log = { workspace = true }
once_cell = { workspace = true }
parking_lot = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
blake3 = { workspace = true }
chrono = { workspace = true }

[dev-dependencies]
proptest = "1"
tempfile = "3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_SystemServices"] }

[lints]
workspace = true

[workspace.package]
edition = "2021"
license = "GPL-3.0-or-later"

[workspace.dependencies]
# must match hachimi-edge Cargo.lock
egui = { version = "=0.33.3", default-features = false, features = ["serde"] }
log = "0.4"
once_cell = "1.19"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
parking_lot = "0.12"
blake3 = "1.5"
ureq = "2.12"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"
non_ascii_idents = "deny"

[workspace.lints.clippy]
correctness = { level = "deny", priority = -1 }
suspicious = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "warn"
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
doc_markdown = "allow"

[profile.release]
lto = true
codegen-units = 1
strip = true
